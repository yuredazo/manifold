[package]
name = "manifold-hub"
version = "1.7.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "manifold_hub"
path = "src/main.rs"

[dependencies]
manifold-protocol = { path = "../protocol" }
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }

[target.'cfg(windows)'.dependencies]
vigem-client = { version = "=0.1.4", features = ["unstable_xtarget_notification"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
libc = "0.2.191"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
x11rb = { version = "0.14.0", features = ["composite", "randr", "shm", "xfixes", "xtest"] }

[build-dependencies]
cc = "1.11.1"
embed-resource = "3.0.12"
resvg = { version = "0.48.1", default-features = false }
sha2 = "0.11.1"
slint-build = "1.18.1"
