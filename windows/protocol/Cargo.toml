[package]
name = "manifold-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The session layer is Manifold's own (WireGuard style), so it takes the raw keys from the handshake.
snow = { version = "0.10.0", features = ["risky-raw-split"] }
chacha20poly1305 = "0.11.0"
x25519-dalek = "3.0.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
