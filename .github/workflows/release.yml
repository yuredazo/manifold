name: Release

# Runs when a version tag such as v1.0.0 is pushed. The tag must match the hub's
# versionName and the Windows app's version, because both hubs compare their own
# version with the tag to offer updates. The Android signing key comes from
# repository secrets.
# Both hubs build at the same time. The release is created once both are built and
# carries both files, so nobody is offered a version that has only one of them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag against the app versions
        run: |
          hub=$(grep -oP 'versionName = "\K[^"]+' hub/build.gradle.kts)
          windows=$(grep -oP '^version: \K[^+]+' desktop/pubspec.yaml)
          if [ "v$hub" != "$GITHUB_REF_NAME" ] || [ "v$windows" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the hub versionName ($hub) or the version in desktop/pubspec.yaml ($windows)"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The release secrets are not set on this repository"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build
        run: ./gradlew :sdk:testDebugUnitTest :hub:testDebugUnitTest :sdk:apiCheck :hub:assembleRelease

      - name: Check the APK carries the release signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs hub/build/outputs/apk/release/hub-release.apk | tee certs.txt
          grep -q 'CN=Manifold, O=mkzk' certs.txt

      - name: Name the APK after the tag
        run: cp hub/build/outputs/apk/release/hub-release.apk "manifold-hub-$GITHUB_REF_NAME.apk"

      - name: Keep the APK for the release
        uses: actions/upload-artifact@v7
        with:
          name: android-hub
          path: manifold-hub-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 1

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip the build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "manifold-hub-windows-$env:GITHUB_REF_NAME.zip"
      - name: Keep the zip for the release
        uses: actions/upload-artifact@v7
        with:
          name: windows-hub
          path: desktop/manifold-hub-windows-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [hub, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Manifold Hub ${GITHUB_REF_NAME#v}" --notes ""
