name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests and API check
        run: ./gradlew :sdk:testDebugUnitTest :hub:testDebugUnitTest :sdk:apiCheck
      - name: Build the apps
        run: ./gradlew :hub:assembleDebug :probe:assembleDebug
      - name: Keep the debug builds
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            hub/build/outputs/apk/debug/hub-debug.apk
            probe/build/outputs/apk/debug/probe-debug.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip the build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath manifold-hub-windows.zip
      - name: Keep the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: windows-hub
          path: desktop/manifold-hub-windows.zip
          if-no-files-found: error
          retention-days: 14
